# Tap: the active click that grants a flat lump of currency. The lowest-barrier casual interaction -
# always available, no cost, no cooldown - applying GE_TapReward (+Currency) to the owner. Early on
# tapping drives progress; as generators come online passive income takes over.

$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/gameplay_ability.json
Name: GA_Tap
Tags:
  AbilityTags:
    - Ability.Type.Tap
Tasks:
  - Type: ApplyEffectToOwner
    Params:
      EffectClass: GE_TapReward
Metadata:
  DisplayName: Tap
  Description: Tap to earn a small lump of currency
  Icon: ui/icons/tap.png
