# Casual (idle / incremental) genre tag taxonomy. ADDITIVE: introduces genre-specific tags only.
# It does not redefine core lifecycle tags (State.Alive / State.Combat / ...) - those are
# referenced by the pack's entities, not declared here. Dynamic states are granted by Effects
# (spec section 7.5), never written directly by abilities.

$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/gameplay_tag.json
Tags:
  # --- Meta-progression states (granted by Effects; gate the prestige ability) ---
  - Tag: Meta.State.PrestigeReady
    Description: Lifetime currency has crossed the prestige threshold; granted by engine threshold logic and required by GA_Prestige
    AllowMultiple: false
  - Tag: Meta.State.Prestiged
    Description: At least one prestige has been performed this profile; granted by GE_PrestigeBoost
    AllowMultiple: false

  # --- Booster states (granted by timed reward Effects; drive the Booster income channel) ---
  - Tag: Booster.State.DoubleIncome
    Description: A double-income booster is active; granted by GE_DoubleIncome for its duration
    AllowMultiple: false

  # --- Generator classification (granted by GE_Generator_* effects; for queries and UI) ---
  - Tag: Generator.Type.Mine
    Description: Entry-tier generator producing a small flat income
    AllowMultiple: true
  - Tag: Generator.Type.Factory
    Description: Mid-tier generator producing a large flat income
    AllowMultiple: true
  - Tag: Generator.Type.Bank
    Description: High-tier generator producing the largest flat income
    AllowMultiple: true

  # --- Ability classification ---
  - Tag: Ability.Type.Tap
    Description: Manual tap that grants a flat lump of currency
    AllowMultiple: false
  - Tag: Ability.Type.Buy
    Description: Purchase ability that spends currency to install a generator
    AllowMultiple: false
  - Tag: Ability.Type.Prestige
    Description: Reset ability that converts run progress into a permanent income multiplier
    AllowMultiple: false
  - Tag: Ability.Type.Play
    Description: Energy-gated active minigame / round ability
    AllowMultiple: false

  # --- Session state (drives UI and gates energy-cost play) ---
  - Tag: Session.State.OutOfEnergy
    Description: Energy has reached 0; granted by engine logic so the UI can prompt a refill (GA_Play cannot pay its cost)
    AllowMultiple: false
