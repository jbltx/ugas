# Cost for GA_ConstructBuilding: spends Minerals to place a structure. An under-resourced player
# cannot pay it, so the build cannot start.

$schema: https://ugas.jbltx.com/%%UGAS_VERSION%%/schemas/gameplay_effect.json
Name: GE_BuildCost
DurationPolicy: Instant
Modifiers:
  - Attribute: Minerals
    Operation: Add
    Magnitude:
      Type: ScalableFloat
      Value: -150.0
