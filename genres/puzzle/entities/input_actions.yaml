# Puzzle genre input actions. Each document defines a single action that an ability listens for.
# Actions are grouped into an Action Set (see input_action_set_board.yaml) and bound to hardware in
# Input Mappings (Touch and PC). SelectTile and ActivatePowerup are the InputIDs the worked
# controller binds to GA_SwapTiles and GA_ActivatePowerup; Drag carries swipe-to-swap direction.

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/input_action.json
Name: SelectTile
ValueType: Digital
TriggerBehavior: OnPressed
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Swap
Metadata:
  DisplayName: Select Tile
  Description: Tap/click a tile to pick it; tap an adjacent tile to confirm a swap
  Icon: ui/icons/select_tile.png
  Category: Board

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/input_action.json
Name: Drag
ValueType: Axis2D
TriggerBehavior: WhileHeld
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Swap
Metadata:
  DisplayName: Drag / Swipe
  Description: Drag from a selected tile to swap it with the neighbour in the swipe direction
  Icon: ui/icons/drag.png
  Category: Board

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/input_action.json
Name: ActivatePowerup
ValueType: Digital
TriggerBehavior: OnDoubleTap
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Powerup
Metadata:
  DisplayName: Activate Powerup
  Description: Double-tap a special tile to detonate its payload
  Icon: ui/icons/powerup.png
  Category: Board

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/input_action.json
Name: UseHint
ValueType: Digital
TriggerBehavior: OnPressed
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Hint
Metadata:
  DisplayName: Use Hint
  Description: Request a highlighted legal move
  Icon: ui/icons/hint.png
  Category: Assist
