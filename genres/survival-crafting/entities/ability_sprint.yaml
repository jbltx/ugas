# Sprint: hold to run faster while draining Stamina. Same hold-then-WaitInputRelease shape as the
# shooter pack's GA_Aim and the racing pack's GA_Drift: apply GE_Sprinting on press, remove it on
# release. GE_Sprinting periodically drains Stamina and grants Survival.State.Sprinting. Blocked while
# Survival.State.Exhausted (the stamina-zero threshold state) so an exhausted survivor must recover
# before sprinting again, and while Survival.State.Overencumbered (too laden to run).

$schema: https://raw.githubusercontent.com/jbltx/ugas/%%UGAS_VERSION%%/schemas/gameplay_ability.json
Name: GA_Sprint
Tags:
  AbilityTags:
    - Ability.Type.Movement
  ActivationRequiredTags:
    - State.Alive
  ActivationBlockedTags:
    - Survival.State.Exhausted
    - Survival.State.Overencumbered
  ActivationOwnedTags:
    - Survival.State.Sprinting
Tasks:
  - Type: ApplyEffectToOwner
    Params:
      EffectClass: GE_Sprinting
  - Type: WaitInputRelease
    Params:
      InputID: Sprint
  - Type: RemoveEffectFromOwner
    Params:
      EffectClass: GE_Sprinting
Metadata:
  DisplayName: Sprint
  Description: Hold to sprint at increased speed, draining stamina
  Icon: ui/icons/sprint.png
