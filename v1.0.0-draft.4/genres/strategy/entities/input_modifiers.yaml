# Reusable input modifiers for the strategy genre. Referenced by name in Input Mappings and run in
# the per-binding pipeline in listed order. EdgePanScaling exposes camera scroll speed to the player;
# the others are designer-owned tuning knobs for camera feel.

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/v1.0.0-draft.4/schemas/input_modifier.json
Name: EdgePanScaling
Type: Sensitivity
Params:
  Multiplier: 1.0
  MultiplierX: 1.0
  MultiplierY: 1.0
UserConfigurable: true
Metadata:
  DisplayName: Camera Scroll Speed
  Description: Player-tunable multiplier on map-scroll speed, shared by edge-pan and keyboard panning

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/v1.0.0-draft.4/schemas/input_modifier.json
Name: CameraDeadzone
Type: DeadZone
Params:
  DeadZoneShape: Radial
  InnerThreshold: 0.1
  OuterThreshold: 0.95
UserConfigurable: false
Metadata:
  DisplayName: Camera Dead Zone
  Description: Radial dead zone for analog camera-pan input - ignores stick drift below 10%

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/v1.0.0-draft.4/schemas/input_modifier.json
Name: CameraSmoothing
Type: ResponseCurve
Params:
  CurveType: SCurve
UserConfigurable: false
Metadata:
  DisplayName: Camera Smoothing
  Description: S-curve response on camera-pan input for smooth acceleration to full scroll speed
