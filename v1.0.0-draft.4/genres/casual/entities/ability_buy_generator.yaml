# Buy generator: spend currency to install an income generator. Costs Currency via GE_BuyGeneratorCost
# (referenced by name; an instant Currency-Add of a negative amount, sized by the next generator's
# price). Because an ability cannot activate if it cannot pay its cost, an insufficient balance gates
# the purchase with no explicit check - the same cost-gate pattern the shooter uses for ammo and the
# racing pack uses for boost. On success it applies a GE_Generator_* (here GE_Generator_Mine), adding
# flat CurrencyPerSecond. Swap the applied effect (or parameterize it) to sell other generator tiers.
#
# NOTE: idle generator prices scale geometrically with the count owned. That price curve is engine
# logic (it sizes GE_BuyGeneratorCost per purchase); the effect application itself is data.

$schema: https://raw.githubusercontent.com/jbltx/ugas/v1.0.0-draft.4/schemas/gameplay_ability.json
Name: GA_BuyGenerator
Tags:
  AbilityTags:
    - Ability.Type.Buy
Cost: GE_BuyGeneratorCost
Tasks:
  - Type: ApplyEffectToOwner
    Params:
      EffectClass: GE_Generator_Mine
Metadata:
  DisplayName: Buy Generator
  Description: Spend currency to install an income generator
  Icon: ui/icons/buy_generator.png
