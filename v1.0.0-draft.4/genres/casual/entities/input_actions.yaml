# Casual (idle / incremental) input actions. Each document defines a single action an ability
# listens for. Actions are grouped into the Idle action set (see input_action_set_idle.yaml) and
# bound to hardware in Input Mappings (see input_mapping_idle_touch.yaml). Casual play is touch-first:
# almost everything is a tap. Tap uses OnTap so a quick press-release reads as a discrete click;
# the rest are OnPressed buttons.

---
$schema: https://raw.githubusercontent.com/jbltx/ugas/v1.0.0-draft.4/schemas/input_action.json
Name: Tap
ValueType: Digital
TriggerBehavior: OnTap
TapThreshold: 0.2
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Tap
Metadata:
  DisplayName: Tap
  Description: Tap the screen to earn currency
  Icon: ui/icons/tap.png
  Category: Core

