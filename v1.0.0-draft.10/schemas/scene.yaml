# Scene Composition Schema Definition
# Based on UGAS Specification v1.0.0-draft.10 - Section 18

type: object
required:
  - Name
  - Placements
properties:
  Name:
    type: string
    description: Unique scene identifier
  Extends:
    type: array
    description: Names of parent scenes this scene composes on top of, additively
    items:
      type: string
  Placements:
    type: array
    description: Gameplay Controller instances placed into the world
    items:
      type: object
      required:
        - Controller
      properties:
        Controller:
          type: string
          description: Name of the GameplayControllerConfig to instantiate
        InstanceId:
          type: string
          description: Stable identity for this instance, used as the persistence key
        Position:
          type: array
          description: World position as x, y, z
          items:
            type: number
        Rotation:
          type: array
          description: World rotation as a quaternion x, y, z, w
          items:
            type: number
        StartupTags:
          type: array
          description: Tags granted to the instance on spawn
          items:
            type: string
        StartupEffects:
          type: array
          description: Effects applied to the instance on spawn
          items:
            type: string
        AttributeOverrides:
          type: object
          description: Base value overrides applied after the controller defaults
          additionalProperties:
            type: number
        Enabled:
          type: boolean
          description: Whether the instance spawns active (default true)
  Regions:
    type: array
    description: Standing zones active while the scene is loaded
    items:
      type: object
      required:
        - Name
        - Shape
        - Origin
        - GrantedTags
      additionalProperties: false
      properties:
        Name:
          type: string
          description: Region identifier
        Shape:
          type: string
          description: Volume shape (§17.2)
          enum:
            - Sphere
            - Box
            - Capsule
        Origin:
          type: array
          description: Sphere or box centre, or capsule reference point, as x, y, z
          items:
            type: number
          minItems: 3
          maxItems: 3
        Radius:
          type: number
          exclusiveMinimum: 0
          description: Sphere or capsule radius
        HalfExtents:
          type: array
          description: Box half extents as x, y, z
          items:
            type: number
          minItems: 3
          maxItems: 3
        Orientation:
          type: array
          description: Box rotation as a quaternion x, y, z, w
          items:
            type: number
          minItems: 4
          maxItems: 4
        P0:
          type: array
          description: First capsule endpoint as x, y, z
          items:
            type: number
          minItems: 3
          maxItems: 3
        P1:
          type: array
          description: Second capsule endpoint as x, y, z
          items:
            type: number
          minItems: 3
          maxItems: 3
        Filter:
          type: object
          description: Which GCs the region acts on (§17.2 SpatialFilter); omitted = all spatial GCs
          additionalProperties: false
          properties:
            RequireTags:
              type: array
              description: Candidate must own all these tags (§7, hierarchical)
              items:
                type: string
            ExcludeTags:
              type: array
              description: Candidate must own none of these tags
              items:
                type: string
            Affiliation:
              type: string
              enum:
                - Any
                - Allied
                - Hostile
                - Neutral
                - SelfOnly
                - ExcludeSelf
              description: Affiliation of candidates (§17.2)
            MaxResults:
              type: integer
              minimum: 0
              description: Cap on occupants (0 = unbounded)
        GrantedTags:
          type: array
          description: Tags granted to occupants while inside the region
          items:
            type: string
      allOf:
        - if:
            properties:
              Shape:
                const: Sphere
          then:
            required:
              - Radius
        - if:
            properties:
              Shape:
                const: Box
          then:
            required:
              - HalfExtents
        - if:
            properties:
              Shape:
                const: Capsule
          then:
            required:
              - P0
              - P1
              - Radius
  SpawnPoints:
    type: array
    description: Named poses for dynamic spawning at runtime
    items:
      type: object
      required:
        - Name
      properties:
        Name:
          type: string
          description: Spawn point identifier
        Position:
          type: array
          description: Spawn position as x, y, z
          items:
            type: number
        Rotation:
          type: array
          description: Spawn rotation as a quaternion x, y, z, w
          items:
            type: number
        Tags:
          type: array
          description: Classification tags for spawn selection
          items:
            type: string
  Metadata:
    type: object
    description: Non-normative authoring metadata
    additionalProperties: true
