name: Publish docs on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (with or without leading v)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout docs branch
        uses: actions/checkout@v6
        with:
          ref: docs
          path: docs

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="${RAW_VERSION#v}"
          if [ -z "${VERSION}" ]; then
            echo "Version is empty. Provide a valid release tag or workflow_dispatch input." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve version placeholders
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          find source/schemas source/genres -type f \( -name '*.json' -o -name '*.yaml' -o -name '*.md' \) \
            -exec sed -i "s/%%UGAS_VERSION%%/${VERSION}/g" {} +
          sed -i "s/%%UGAS_VERSION%%/${VERSION}/g" source/llms.txt

      - name: Install Asciidoctor and Pandoc
        run: |
          sudo gem install asciidoctor
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Build SPEC.adoc with AsciiDoctor
        run: |
          asciidoctor \
            -a revnumber="${{ steps.version.outputs.version }}" \
            -a ugas-version="v${{ steps.version.outputs.version }}" \
            -a stem=latexmath \
            source/SPEC.adoc \
            -o source/index.html

      - name: Build genre packs with AsciiDoctor
        run: |
          for spec in source/genres/*/spec.adoc; do
            [ -f "$spec" ] || continue
            genre="$(basename "$(dirname "$spec")")"
            asciidoctor \
              -a revnumber="${{ steps.version.outputs.version }}" \
              -a ugas-version="v${{ steps.version.outputs.version }}" \
              -a stem=latexmath \
              "$spec" \
              -o "source/genres/${genre}/index.html"
          done

      - name: Build genre taxonomy with AsciiDoctor
        run: |
          if [ -f source/genres/taxonomy.adoc ]; then
            asciidoctor \
              -a revnumber="${{ steps.version.outputs.version }}" \
              -a ugas-version="v${{ steps.version.outputs.version }}" \
              -a stem=latexmath \
              source/genres/taxonomy.adoc \
              -o source/genres/taxonomy.html
          fi

      - name: Build genre packs index with AsciiDoctor
        run: |
          if [ -f source/genres/index.adoc ]; then
            asciidoctor \
              -a revnumber="${{ steps.version.outputs.version }}" \
              -a ugas-version="v${{ steps.version.outputs.version }}" \
              -a stem=latexmath \
              source/genres/index.adoc \
              -o source/genres/index.html
          fi

      - name: Generate LLM files
        run: |
          bash source/scripts/generate-llm-files.sh source source "v${{ steps.version.outputs.version }}"

      - name: Copy files to docs branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEST="docs/v${VERSION}"
          mkdir -p "${DEST}/schemas"
          cp -r source/schemas/* "${DEST}/schemas/"
          cp source/SPEC.adoc "${DEST}/SPEC.adoc"
          cp -r source/spec "${DEST}/spec"
          [ -d source/genres ] && cp -r source/genres "${DEST}/genres"
          cp source/index.html "${DEST}/index.html"
          cp source/SPEC.md "${DEST}/SPEC.md"
          cp source/llms.txt docs/llms.txt
          cp source/llms-full.txt docs/llms-full.txt

      - name: Update README version table
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="$(date -u +%Y-%m-%d)"

          if [ ! -f docs/README.md ]; then
            echo "README.md not found, skipping"
          elif grep -qF "[v${VERSION}]" docs/README.md; then
            echo "Version v${VERSION} already in README, skipping"
          else
            ROW="| [v${VERSION}](v${VERSION}/) | ${DATE} | Pre-release | [Spec](v${VERSION}/index.html) | [Schemas](v${VERSION}/schemas/) |"
            # Insert as first data row after the table separator (newest first)
            awk -v row="$ROW" '/^\|[-| ]+\|$/ && !done { print; print row; done=1; next } 1' \
              docs/README.md > docs/README.tmp && mv docs/README.tmp docs/README.md
          fi

      - name: Build landing page
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE="$(date -u +%Y-%m-%d)"
          bash source/scripts/build-landing-page.sh "${VERSION}" "${DATE}" docs source

      - name: Create PR to docs branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="docs-pr/v${VERSION}"

          cd docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git checkout -b "${BRANCH}"
          git commit -m "docs: publish v${VERSION}"
          git push -u origin "${BRANCH}" --force

          EXISTING_PR=$(gh pr list --base docs --head "${BRANCH}" --json number --jq '.[0].number')
          if [ -n "${EXISTING_PR}" ]; then
            echo "PR #${EXISTING_PR} already exists, updated with force push"
          else
            gh pr create \
              --base docs \
              --head "${BRANCH}" \
              --title "docs: publish v${VERSION}" \
              --body "Automated PR to publish docs for release v${VERSION}.

          - \`SPEC.adoc\` → \`v${VERSION}/SPEC.adoc\`
          - \`SPEC.adoc\` → \`v${VERSION}/index.html\` (HTML with AsciiDoctor)
          - \`SPEC.adoc\` → \`v${VERSION}/SPEC.md\` (Markdown via Pandoc)
          - \`schemas/**/*\` → \`v${VERSION}/schemas/\`
          - \`genres/**\` → \`v${VERSION}/genres/\` (genre pack templates + rendered specs, index, taxonomy)
          - \`llms.txt\` → root (LLM discoverability)
          - \`llms-full.txt\` → root (complete LLM context)
          - \`index.html\` → root (landing page, version table + latest links)
          - \`versions.json\` → root (version manifest)"
          fi
