name: Publish npm package on release

# Stages packages/spec on npm when a GitHub release is published, at the release's version.
# Authenticates with npm trusted publishing (OIDC): no token secret. The trusted publisher on
# npmjs.com must name this file (publish-npm.yml) and only allows staged publishing, so the
# version goes live only once the owner approves it on npmjs.com; see RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/spec
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/spec/package-lock.json

      - name: Use an npm that supports staged publishing (>= 11.15.0)
        run: npm install -g npm@^11.15.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        # Same toolchain as publish-docs.yml, so the packaged spec sections match the site's.
        run: |
          python -m pip install --quiet PyYAML
          sudo gem install asciidoctor
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Resolve version and dist-tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_VERSION="$(node -p "require('../../package.json').version")"
          if [ "${VERSION}" != "${REPO_VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${REPO_VERSION}." >&2
            exit 1
          fi
          case "${VERSION}" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          NAME="$(node -p "require('./package.json').name")"
          SKIP=false
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; nothing to stage."
            SKIP=true
          # A staged version shares the published versions' unique index, so staging it again
          # fails. Best effort: if the stage queue cannot be read, try to stage anyway.
          elif STAGED="$(npm stage list "${NAME}" --json 2>/dev/null)" \
            && echo "${STAGED}" | jq -e --arg v "${VERSION}" 'any(.[]; .version == $v)' >/dev/null; then
            echo "${NAME}@${VERSION} is already staged; approve or reject it on npmjs.com."
            echo "${NAME}@${VERSION} is already staged and waits for approval on https://www.npmjs.com/package/${NAME}" >> "$GITHUB_STEP_SUMMARY"
            SKIP=true
          fi
          {
            echo "skip=${SKIP}"
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "dist-tag=${DIST_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Staging ${NAME}@${VERSION} under dist-tag ${DIST_TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: List tarball
        run: npm run pack:dry

      - name: Stage for owner approval
        if: steps.version.outputs.skip == 'false'
        working-directory: packages/spec/build
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        # The trusted publisher allows `npm stage publish` only. The dist-tag is fixed on the
        # staged version and applied when the owner approves it.
        run: |
          npm stage publish --provenance --access public --tag "${DIST_TAG}"
          {
            echo "### ${NAME}@${VERSION} staged on npm"
            echo
            echo "It goes live under the \`${DIST_TAG}\` dist-tag once the owner approves it with 2FA:"
            echo "once npm's automated review finishes, open https://www.npmjs.com/settings/jbltx/staged-packages, then **Approve**."
            echo "Or run \`npm stage list ${NAME}\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
