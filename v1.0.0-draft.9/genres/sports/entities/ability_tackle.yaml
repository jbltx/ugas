# Tackle: challenge a hostile ball-carrier for possession. Costs stamina (GE_TackleCost: Stamina -6)
# and goes on a cooldown (GE_TackleCooldown) so mistimed lunges leave the defender exposed. Requires a
# Team.Hostile target; Tackling and Strength govern whether the ball is won cleanly (a mistimed tackle
# is where GE_Injury typically gets applied to the loser). GE_TackleCost and GE_TackleCooldown are a
# flat Stamina cost and a cooldown tag (effect_tackle_cost.yaml, effect_tackle_cooldown.yaml).

$schema: https://ugas.jbltx.com/v1.0.0-draft.9/schemas/gameplay_ability.json
Name: GA_Tackle
Tags:
  AbilityTags:
    - Ability.Type.Tackle
  ActivationRequiredTags:
    - State.Alive
Cost: GE_TackleCost
Cooldown: GE_TackleCooldown
Tasks:
  - Type: WaitTargetData
    Params:
      TargetingMethod: ChallengeTrace
      RequiredTags:
        - Team.Hostile
Metadata:
  DisplayName: Tackle
  Description: Challenge a hostile ball-carrier; success scales with Tackling and Strength
  Icon: ui/icons/tackle.png
