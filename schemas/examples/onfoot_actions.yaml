# Example: OnFoot Actions (Shooter)
# The rest of the OnFoot set's actions (Fire lives in fire_action.yaml), one per document.

---
$schema: https://ugas.jbltx.com/%%UGAS_VERSION%%/schemas/input_action.json
Name: Move
ValueType: Axis2D
TriggerBehavior: WhileHeld
ConsumeInput: true
