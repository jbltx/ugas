# Sports genre input actions. Each document defines a single action that an ability or movement
# system listens for. Actions are grouped into an Action Set (see input_action_set_outfield.yaml)
# and bound to hardware in Input Mappings. The action Names match the InputID values on the granted
# abilities in gameplay_controller.yaml (Sprint, Pass, Shoot, Tackle, SkillMove).

---
$schema: https://ugas.jbltx.com/v1.0.0-draft.6/schemas/input_action.json
Name: Move
ValueType: Axis2D
TriggerBehavior: WhileHeld
ConsumeInput: true
Tags:
  ActionTags: []
Metadata:
  DisplayName: Move
  Description: Omnidirectional ground movement
  Icon: ui/icons/move.png
  Category: Movement

---
$schema: https://ugas.jbltx.com/v1.0.0-draft.6/schemas/input_action.json
Name: Look
ValueType: Axis2D
TriggerBehavior: WhileHeld
ConsumeInput: true
Tags:
  ActionTags: []
Metadata:
  DisplayName: Look
  Description: Camera / aiming direction for passes and shots
  Icon: ui/icons/look.png
  Category: Movement

---
$schema: https://ugas.jbltx.com/v1.0.0-draft.6/schemas/input_action.json
Name: Sprint
ValueType: Digital
TriggerBehavior: WhileHeld
ConsumeInput: true
Tags:
  ActionTags:
    - Ability.Type.Sprint
Metadata:
  DisplayName: Sprint
  Description: Hold to sprint at full speed, draining stamina
  Icon: ui/icons/sprint.png
  Category: Movement

