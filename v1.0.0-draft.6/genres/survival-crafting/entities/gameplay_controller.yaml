  - Name: SurvivorVitalsSet
    Attributes:
      - Name: MaxHealth
        BaseValue: 100.0
        CurrentValue: 100.0
      - Name: Health
        BaseValue: 40.0
        CurrentValue: 40.0
      - Name: MaxHunger
        BaseValue: 100.0
        CurrentValue: 100.0
      - Name: Hunger
        BaseValue: 0.0
        CurrentValue: 0.0
      - Name: MaxThirst
        BaseValue: 100.0
        CurrentValue: 100.0
      - Name: Thirst
        BaseValue: 30.0
        CurrentValue: 30.0
      - Name: MaxStamina
        BaseValue: 100.0
        CurrentValue: 100.0
      - Name: Stamina
        BaseValue: 100.0
        CurrentValue: 100.0
      - Name: BodyTemperature
        BaseValue: 34.0
        CurrentValue: 34.0
      - Name: MoveSpeed
        BaseValue: 300.0
        CurrentValue: 135.0
      - Name: MaxCarryWeight
        BaseValue: 50.0
        CurrentValue: 50.0
      - Name: CarryWeight
        BaseValue: 65.0
        CurrentValue: 65.0
      - Name: Materials
        BaseValue: 0.0
        CurrentValue: 12.0
      - Name: WarmthRating
        BaseValue: 0.0
        CurrentValue: 0.0
      - Name: VitalsDrainRate
        BaseValue: 0.0
        CurrentValue: -3.0
GrantedAbilities:
