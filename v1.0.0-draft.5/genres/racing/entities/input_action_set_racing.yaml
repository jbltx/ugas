# Racing action set: groups all on-track driving inputs.
# Active only while the vehicle is racing and not spun out.

$schema: https://ugas.jbltx.com/v1.0.0-draft.5/schemas/input_action_set.json
Name: RacingOnTrack
Actions:
  - Steer
  - Throttle
  - Brake
  - Boost
  - Drift
  - Look
Priority: 0
ActivationTags:
  RequiredTags:
    - Vehicle
    - Race.Phase.Racing
  BlockedTags:
    - Vehicle.State.SpunOut
Metadata:
  DisplayName: Racing
  Description: Core driving input set active during on-track racing
